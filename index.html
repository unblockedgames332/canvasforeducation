<script>
const newTab = window.open("about:blank", "_blank");

if (newTab) {
    newTab.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>Main</title>
            <style>
                html, body {
                    margin: 0;
                    padding: 0;
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                }
                iframe {
                    width: 100%;
                    height: 100%;
                    border: 0;
                }
            </style>
        </head>
        <body>
            <iframe src="${new URL("main.html", window.location.href).href}"></iframe>
        </body>
        </html>
    `);
    newTab.document.close();

    // Close the original page
    window.close();
}
</script>
